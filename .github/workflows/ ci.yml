name: Deploy HTML to S

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::660463065909:role/amazon_s3_full_access
          aws-region: ap-southeast-2

      - name: Upload website to S3 bucket
        run: aws s3 cp index.html s3://amzon-s3-cd-buck/index.html --content-type text/html
