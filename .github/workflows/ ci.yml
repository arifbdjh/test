name: Deploy HTML to S3
on: push
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: checkout the code from repo
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::660463065909:role/amazon_s3_full_access
          aws-region: ap-southeast-2
      - name: Upload website to S3
        run: aws s3 sync index.html s3://amzon-s3-cd-buck/ --delete
