name: Deploy HTML to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show OIDC claims for diagnosis
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&" + urllib.parse.urlencode({"audience": "sts.amazonaws.com"})
          request = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for key in ("iss", "aud", "sub", "ref", "environment", "repository",
                      "repository_owner_id", "repository_id"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::660463065909:role/amazon_s3_full_access
          aws-region: ap-southeast-2

      - name: Upload website to S3 bucket
        run: aws s3 cp index.html s3://amzon-s3-cd-buck/index.html --content-type text/html
